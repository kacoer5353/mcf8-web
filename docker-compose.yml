version: '3.8'

services:
  # Web application service running Apache and PHP
  web:
    build: .
    container_name: mcf8_web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:z
    restart: always
    depends_on:
      - db

  # Database service running PostgreSQL
  db:
    image: postgres:15
    container_name: mcf8_db_server
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mcf8_db}
      POSTGRES_USER: ${DB_USER:-mcf8_user}
      POSTGRES_PASSWORD: ${DB_PASS:-mcf8_password_123}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Map SQL schema to automatically initialize tables and mock data on first launch
      - ./schema.postgres.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional lightweight DB GUI for inspection (Adminer supports PostgreSQL)
  adminer:
    image: adminer:latest
    container_name: mcf8_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
